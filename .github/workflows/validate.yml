# Controle van de site bij elke push naar main en elke pull request naar main.
# Zelfde stap als op Netlify (python build.py). Mislukt de build, dan stuurt
# GitHub standaard een mail naar wie de commit pushte.
# Actions zijn vastgezet op een commit-SHA (versie in de opmerking).
# Python-versie: houd gelijk met PYTHON_VERSION in netlify.toml.

name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Controle + build
        run: python build.py --list
