  <section id="contact">
    <div class="sec-label sec-label--center">{{ contact.label }}</div>
    <h1 class="sec-h2 sec-h2--center">{{ contact.title }}</h1>

    <div class="contact-center">
      <div class="contact-card">
        <div class="corner c-tl"></div>
        <div class="corner c-tr"></div>
        <div class="corner c-bl"></div>
        <div class="corner c-br"></div>

        <p>{{ contact.intro }}</p>

        <!-- Netlify Forms: het formulier werkt zodra de site op Netlify staat.
             "bot-field" is de honeypot tegen spam (verborgen voor bezoekers). -->
        <form class="contact-form" name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
          <input type="hidden" name="form-name" value="contact">
          <p class="form-hp">
            <label>{{ contact.form.honeypot }} <input name="bot-field" tabindex="-1" autocomplete="off"></label>
          </p>
          <div class="form-row">
            <label for="f-name">{{ contact.form.name }}</label>
            <input id="f-name" name="name" type="text" autocomplete="name" maxlength="100" required>
          </div>
          <div class="form-row">
            <label for="f-email">{{ contact.form.email }}</label>
            <input id="f-email" name="email" type="email" autocomplete="email" maxlength="200" required>
          </div>
          <div class="form-row">
            <label for="f-message">{{ contact.form.message }}</label>
            <textarea id="f-message" name="message" rows="6" maxlength="4000" required></textarea>
          </div>
          <button type="submit" class="btn-p">{{ contact.form.submit }}</button>
          <p class="form-privacy">{{ contact.form.privacy }}</p>
        </form>

        <div class="contact-links">
          <span class="contact-alt">{{ contact.alt }}</span>
          <!-- Adres wordt door js/main.js samengesteld (anti-spam) -->
          <a href="#" class="clink js-mail">✉ {{ contact.email }}</a>
        </div>
      </div>
    </div>
  </section>
